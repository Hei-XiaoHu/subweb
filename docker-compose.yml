services:
  subweb:
    image: heixiaohu/subweb:latest
    build: .
    container_name: subweb
    restart: always
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      # 首次启动会自动在 ./conf 下生成默认 config.js,按需修改后刷新页面即生效
      - ./conf:/usr/share/nginx/html/conf
    environment:
      - TZ=Asia/Shanghai

  subconverter:
    image: asdlokj1qpi23/subconverter:latest
    container_name: subconverter
    restart: always
    ports:
      - "127.0.0.1:25500:25500"
    environment:
      - TZ=Asia/Shanghai
